<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Tableau Statique</h2>
    

    <div class="test">

        
        <div id="container_tableau">

                                    <div id="form_container">
                <div class="form_group">
                    <label class="form_label">Nom:</label>
                    <input type="text" id="form_nom" class="form_field">
                </div>

                                <div class="form_group">
                    <label class="form_label">Prénom:</label>
                    <input type="text" id="form_prenom" class="form_field">
                </div>

                                <div class="form_group">
                    <label class="form_label">Points:</label>
                    <input type="text" id="form_points" class="form_field">
                </div>


                <button id="btn_ajouter" onclick="doNewData()">Ajouter</button>



            </div>




            <table>

                <thead>
                    <tr>
                        <th class="col_number">Nº</th>
                        <th class="col_text">Nom</th>
                        <th class="col_text">Prénom</th>
                        <th class="col_number">Points</th>
                        <th class="col_chckbox">Select</th>
                    </tr>
                </thead>
                <tbody>

                    </tr>
                </tbody>



            </table>

            <div id="container_summary">
                <p id="p1"> 0 ligne(s)</p>
                <p id="p2"></p>
                <p id="p3">Totale point(s) = 0 </p>

            </div>


            <div id="container_btn">

            <button id="btn_console">Console Tableau</button>
            <button id="btn_supp" onclick="deleteRow()">suprimer</button>

            </div>


        </div>


    </div>

    <script src="script.js"></script>
</body>
</html>
